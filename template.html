<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototypes · Effectory UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://effectory-ux.github.io/Engage-Design-system-/tokens.css" />
<link rel="stylesheet" href="https://effectory-ux.github.io/Engage-Design-system-/foundation.css" />
<link rel="stylesheet" href="https://effectory-ux.github.io/Engage-Design-system-/components.css" />
<script src="https://effectory-ux.github.io/Engage-Design-system-/icons.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-interface-body-secondary, var(--bg-secondary));
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--content-base);
  }
  a { color: inherit; text-decoration: none; }

  /* ── Paginakop, in de pagina zelf zoals Figma ── */
  .page-head {
    display: flex; align-items: center; gap: var(--spacing-base);
    margin-bottom: var(--spacing-base);
  }
  .page-title { display: flex; align-items: baseline; gap: var(--spacing-tight); margin-right: auto; }
  .page-title h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .page-count { font-size: 14px; color: var(--content-secondary); }

  .search { position: relative; width: 240px; }
  .search i {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    display: flex; width: 16px; height: 16px; color: var(--content-subtle);
    pointer-events: none;
  }
  .search input {
    width: 100%; height: 32px;
    padding: 0 var(--spacing-base-tight) 0 32px;
    font: 400 14px 'Poppins', system-ui, sans-serif;
    color: var(--content-base);
    background: var(--bg-base);
    border: 1px solid var(--border-base);
    border-radius: var(--radius-base);
    outline: none;
  }
  .search input:hover { border-color: var(--border-action-hover); }
  .search input:focus { border-color: var(--border-action); box-shadow: var(--sh-action); }
  .search input::placeholder { color: var(--content-subtle); }
  #dsbtn { height: 32px; }
  #dsbtn i { display: flex; width: 16px; height: 16px; }

  /* ── Filters ── */
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-bottom: var(--spacing-base);
    margin-bottom: var(--spacing-loose);
    border-bottom: 1px solid var(--border-base);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px;
    font: 500 12px 'Poppins', system-ui, sans-serif;
    color: var(--content-secondary);
    background: var(--bg-base);
    border: 1px solid var(--border-base);
    border-radius: var(--radius-full);
    cursor: pointer;
  }
  .chip:hover { background: var(--bg-secondary); color: var(--content-base); }
  .chip.is-on {
    color: var(--content-brand);
    background: var(--bg-brand-subtle);
    border-color: var(--border-brand-subtle);
  }
  .chip-n { font-weight: 400; opacity: .7; }
  .filters-sep { width: 1px; background: var(--border-base); margin: 4px var(--spacing-extra-tight); }

  .wrap {
    /* 80px zijmarge, ruimer dan de spacing-schaal (die stopt bij 56). */
    padding: var(--spacing-extra-loose) 80px var(--spacing-super-extra-loose);
    max-width: 1600px; margin: 0 auto;
  }

  /* ── Sections ── */
  .sec { margin-bottom: var(--spacing-extra-loose); }
  .sec-hd { display: flex; align-items: center; gap: var(--spacing-tight); margin-bottom: var(--spacing-base-tight); }
  .sec-t { font-size: 16px; font-weight: 600; }
  .sec-n { font-size: 12px; color: var(--content-secondary); }
  .sec-line { flex: 1; height: 1px; background: var(--border-base); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--spacing-base); }

  /* ── Card ── */
  .card {
    display: flex; flex-direction: column;
    background: var(--bg-base);
    border: 1px solid var(--border-base);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--sh-card);
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card:hover { box-shadow: var(--sh-card-hover); transform: translateY(-2px); border-color: var(--border-base-hover); }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-base);
    overflow: hidden;
    display: block;
  }
  .thumb iframe {
    position: absolute; top: 0; left: 0;
    width: 1440px; height: 900px;
    border: 0;
    transform-origin: 0 0;
    transform: scale(var(--s, .22));
    pointer-events: none;
    background: var(--bg-base);
  }
  .thumb-skel {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 12px; color: var(--content-subtle);
    background: var(--bg-secondary);
  }
  .thumb.is-loaded .thumb-skel { display: none; }
  .thumb-none {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--content-subtle);
    background: repeating-linear-gradient(45deg,
      var(--bg-secondary) 0 10px, var(--bg-secondary-hover) 10px 20px);
  }
  .thumb-none svg { width: 20px; height: 20px; opacity: .5; }

  .open-ov {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(25, 39, 67, .5);
    opacity: 0; transition: opacity .15s ease;
  }
  .card:hover .open-ov { opacity: 1; }
  .open-pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 var(--spacing-base);
    font-size: 14px; font-weight: 600;
    color: var(--content-base);
    background: var(--bg-base);
    border-radius: var(--radius-full);
    box-shadow: var(--sh-popovers);
  }
  .open-pill svg { width: 14px; height: 14px; }

  .card-body { padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-hd { display: flex; align-items: flex-start; gap: 6px; }
  .card-t { font-size: 16px; font-weight: 600; line-height: 1.3; flex: 1; letter-spacing: -0.01em; }
  .card-d {
    font-size: 12px; color: var(--content-secondary); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto; padding-top: 10px;
    border-top: 1px solid var(--border-base);
  }
  .card-meta .av { cursor: default; }

  /* Compacte varianten van de design-system-knop, voor in een kaartvoet. */
  .btn.btn-xs { height: 28px; padding: 0 8px; font-size: 12px; gap: 6px; }
  .btn.btn-xs i { display: flex; width: 13px; height: 13px; }
  .btn.btn-quiet { color: var(--content-secondary); }
  .btn.btn-quiet:hover { color: var(--content-base); }
  .meta-right { margin-left: auto; }

  /* ── Modal with every page of a prototype ── */
  .ov {
    position: fixed; inset: 0; z-index: 90;
    display: none; align-items: center; justify-content: center;
    padding: var(--spacing-loose);
    background: rgba(25, 39, 67, .45);
  }
  .ov.is-open { display: flex; }
  .modal {
    display: flex; flex-direction: column;
    width: 100%; max-width: 520px; max-height: 80vh;
    background: var(--bg-base);
    border-radius: var(--radius-xl);
    box-shadow: var(--sh-dialogs);
    overflow: hidden;
  }
  .modal-hd {
    display: flex; align-items: flex-start; gap: var(--spacing-base);
    padding: var(--spacing-base) var(--spacing-base) var(--spacing-base-tight);
    border-bottom: 1px solid var(--border-base);
  }
  .modal-t { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .modal-sub { font-size: 12px; color: var(--content-secondary); margin-top: 2px; }
  .modal-x {
    margin-left: auto; flex: none;
    display: grid; place-items: center;
    width: 32px; height: 32px;
    border: 0; border-radius: var(--radius-base);
    background: transparent; color: var(--content-secondary);
    cursor: pointer;
  }
  .modal-x:hover { background: var(--bg-secondary); color: var(--content-base); }
  .modal-x svg { width: 14px; height: 14px; }
  .modal-repos {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: var(--spacing-base-tight) var(--spacing-base);
    border-bottom: 1px solid var(--border-base);
  }
  .modal-repos:empty { display: none; }
  .modal-list { overflow-y: auto; padding: var(--spacing-tight); }
  .modal-row {
    display: flex; align-items: center; gap: var(--spacing-base-tight);
    padding: var(--spacing-tight) var(--spacing-base-tight);
    border-radius: var(--radius-md);
  }
  .modal-row:hover { background: var(--bg-secondary); }
  .modal-num {
    flex: none; display: grid; place-items: center;
    width: 22px; height: 22px;
    font-size: 12px; font-weight: 600;
    color: var(--content-secondary);
    background: var(--bg-secondary);
    border-radius: var(--radius-full);
  }
  .modal-row:hover .modal-num { background: var(--bg-brand-subtle); color: var(--content-brand); }
  .modal-lbl { font-size: 14px; font-weight: 500; }
  .modal-path { font-size: 12px; color: var(--content-subtle); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .modal-open { margin-left: auto; flex: none; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--content-action); }
  .modal-open svg { width: 12px; height: 12px; }
  .modal-ft { padding: var(--spacing-base-tight) var(--spacing-base); border-top: 1px solid var(--border-base); font-size: 12px; color: var(--content-subtle); }

  /* Repo-chip in de modal, kleur per org. */
  .tag {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 3px var(--spacing-tight);
    font-size: 12px; font-weight: 500; line-height: 1.35;
    border-radius: var(--radius-sm);
    background: var(--bg-secondary);
    color: var(--content-secondary);
    max-width: 100%; word-break: break-word;
  }
  .tag.org-ux { background: var(--bg-brand-subtle); color: var(--content-brand); }
  .tag.org-design { background: var(--bg-accent-blue-subtle); color: var(--content-accent-blue); }
  .tag.org-eray { background: var(--bg-accent-purple-subtle); color: var(--content-base); }
  .tag.org-jamal { background: var(--bg-accent-turquoise-subtle); color: var(--content-accent-turquoise); }
  .tag-dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; flex: none; position: relative; top: 5px; }

  /* ── Renaming ── */
  .card-edit {
    flex: none; display: grid; place-items: center;
    width: 24px; height: 24px; margin: -2px -4px 0 0;
    border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--content-subtle);
    cursor: pointer; opacity: 0;
    transition: opacity .12s ease;
  }
  .card:hover .card-edit, .card-edit:focus { opacity: 1; }
  .card-edit:hover { background: var(--bg-secondary); color: var(--content-base); }
  .card-edit svg { width: 13px; height: 13px; }

  .card-t input {
    width: 100%;
    font: 600 16px 'Poppins', system-ui, sans-serif;
    color: var(--content-base);
    background: var(--bg-base);
    border: 1px solid var(--border-action);
    border-radius: var(--radius-sm);
    padding: 2px 6px; margin: -3px -7px;
    outline: none;
    box-shadow: var(--sh-action);
  }
  .card.is-renamed .card-t::after {
    content: "hernoemd";
    display: inline-block; margin-left: 6px; vertical-align: middle;
    padding: 1px 6px;
    font-size: 12px; font-weight: 500;
    color: var(--content-highlight);
    background: var(--bg-highlight-subtle);
    border-radius: var(--radius-full);
  }

  .pub {
    position: fixed; left: 50%; bottom: var(--spacing-loose); z-index: 50;
    transform: translateX(-50%) translateY(140%);
    opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: var(--spacing-base-tight);
    padding: var(--spacing-base-tight) var(--spacing-base-tight) var(--spacing-base-tight) var(--spacing-base);
    background: var(--bg-inverse);
    color: var(--content-inverse);
    border-radius: var(--radius-full);
    box-shadow: var(--sh-dialogs);
    transition: transform .2s ease, opacity .2s ease;
  }
  .pub.is-on { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
  .pub-txt { font-size: 14px; font-weight: 500; }
  .pub-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 var(--spacing-base-tight);
    font: 500 14px 'Poppins', system-ui, sans-serif;
    border: 0; border-radius: var(--radius-full);
    background: var(--bg-base); color: var(--content-base);
    cursor: pointer;
  }
  .pub-btn:hover { background: var(--bg-secondary); }
  .pub-btn.ghost { background: transparent; color: var(--content-inverse); opacity: .8; }
  .pub-btn.ghost:hover { background: rgba(255,255,255,.14); opacity: 1; }

  .steps { padding: var(--spacing-base); font-size: 14px; line-height: 1.6; }
  .steps ol { margin: 0; padding-left: var(--spacing-base); }
  .steps li { margin-bottom: 6px; }
  .steps code { font-size: 12px; background: var(--bg-secondary); padding: 1px 5px; border-radius: var(--radius-sm); }
  .steps .done { color: var(--content-positive); font-weight: 500; }

  .empty { padding: var(--spacing-super-loose); text-align: center; color: var(--content-secondary); font-size: 14px; }

  .foot { margin-top: var(--spacing-extra-loose); padding-top: var(--spacing-base); border-top: 1px solid var(--border-base); font-size: 12px; color: var(--content-subtle); line-height: 1.7; }
  .foot a { color: var(--content-action); }
  .foot code { font-size: 12px; background: var(--bg-secondary); padding: 1px 5px; border-radius: var(--radius-sm); }

  @media (max-width: 1100px) {
    .wrap { padding: var(--spacing-loose) var(--spacing-extra-loose) var(--spacing-super-loose); }
  }
  @media (max-width: 720px) {
    .wrap { padding: var(--spacing-base); }
    .page-head { flex-wrap: wrap; }
    .page-title { width: 100%; }
    .search { flex: 1; width: auto; }
  }
</style>
</head>
<body>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ov-title">
  <div class="modal" id="modal">
    <div class="modal-hd">
      <div>
        <div class="modal-t" id="ov-title"></div>
        <div class="modal-sub" id="ov-sub"></div>
      </div>
      <button class="modal-x" id="ov-close" aria-label="Sluiten"></button>
    </div>
    <div class="modal-repos" id="ov-repos"></div>
    <div class="modal-list" id="ov-list"></div>
    <div class="modal-ft" id="ov-ft"></div>
  </div>
</div>

<div class="pub" id="pub">
  <span class="pub-txt" id="pub-txt"></span>
  <button class="pub-btn" id="pub-go">Publiceren</button>
  <button class="pub-btn ghost" id="pub-undo">Ongedaan maken</button>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">
      <h1>Prototypes</h1>
      <span class="page-count" id="count">__COUNT__</span>
    </div>
    <div class="search">
      <i data-icon="search"></i>
      <input id="q" type="search" placeholder="Zoek op naam of repo" autocomplete="off" />
    </div>
    <a class="btn btn-primary" id="dsbtn" href="#" target="_blank" rel="noopener">
      <i data-icon="book-open"></i>
      Design system
    </a>
  </div>
  <div class="filters" id="filters"></div>
  <div id="sections"></div>
  <div class="foot">
    Eén kaart per prototype. Een prototype met meerdere schermen opent op zijn beginpagina.<br />
    Verversen na nieuwe prototypes: pas <code>prototypes.json</code> aan en draai <code>./build-gallery.py</code>.<br />
    <span id="foot-src"></span>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
const DS = /*__DS__*/;
const REPOS = /*__REPOS__*/;
const CONFIG = /*__CONFIG__*/;
const GALLERY_REPO = "effectory-ux/prototypes";

/* Renames are shared through the worker in CONFIG.sync.url: a name typed here is
   what the next visitor sees. Without that URL they stay in this browser and are
   published to prototypes.json by hand. */
const SYNC = (CONFIG.sync && CONFIG.sync.url) || "";
const STORE = "effx-gallery-names";
const KEYSTORE = "effx-gallery-key";

let renames = {};
try { renames = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { renames = {}; }

const nameOf = d => renames[d.id] || d.name;

function saveLocal() {
  try { localStorage.setItem(STORE, JSON.stringify(renames)); } catch (e) {}
}

function saveRenames() {
  saveLocal();
  if (SYNC) push();
  renderPub();
}

/* ── Sharing through the worker ── */
let syncState = SYNC ? "idle" : "off";   // idle | saving | saved | failed | off
let pushing = false, dirty = false;

/* index.html is generated, so a name committed to prototypes.json would not show
   up until the next build. Read that file at load instead: publishing a rename is
   then a single commit, no regeneration needed. */
async function pullFile() {
  try {
    const res = await fetch("prototypes.json", { cache: "no-store" });
    if (!res.ok) return;
    const cfg = await res.json();
    if (!cfg || !Array.isArray(cfg.entries)) return;

    const published = {};
    cfg.entries.forEach(e => { published[e.repo + "::" + e.path] = e.name; });

    let changed = false;
    DATA.forEach(d => {
      const name = published[d.id];
      if (!name || name === d.name) return;
      d.name = name;                       // what everyone sees
      if (renames[d.id] === name) {        // my local edit is now the published one
        delete renames[d.id];
        saveLocal();
      }
      changed = true;
    });
    if (changed) { render(); renderPub(); }
  } catch (e) {
    // Falls back to the names baked into the page.
  }
}

async function pull() {
  if (!SYNC) return;
  try {
    const res = await fetch(SYNC + "/names", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const shared = await res.json();
    if (shared && typeof shared === "object") {
      renames = shared;
      saveLocal();
      render();
    }
  } catch (e) {
    // Offline or worker down: the names from localStorage stay on screen.
  }
}

async function push() {
  if (!SYNC) return;
  if (pushing) { dirty = true; return; }
  const key = await editKey();
  if (!key) { syncState = "failed"; renderPub(); return; }

  pushing = true;
  syncState = "saving";
  renderPub();
  try {
    const res = await fetch(SYNC + "/names", {
      method: "PUT",
      headers: { "content-type": "application/json", "x-edit-key": key },
      body: JSON.stringify(renames),
    });
    if (res.status === 401) {
      try { localStorage.removeItem(KEYSTORE); } catch (e) {}
      throw new Error("unauthorized");
    }
    if (!res.ok) throw new Error(res.status);
    syncState = "saved";
    setTimeout(() => { if (syncState === "saved") { syncState = "idle"; renderPub(); } }, 2500);
  } catch (e) {
    syncState = "failed";
  }
  pushing = false;
  renderPub();
  if (dirty) { dirty = false; push(); }
}

/* The key is a shared passphrase, asked once per browser, so a random visitor
   cannot rename things. Reading the gallery never needs it. */
function editKey() {
  let stored = null;
  try { stored = localStorage.getItem(KEYSTORE); } catch (e) {}
  if (stored) return Promise.resolve(stored);

  return new Promise(resolve => {
    document.getElementById("ov-title").textContent = "Sleutel invullen";
    document.getElementById("ov-sub").textContent = "Eén keer per browser, daarna niet meer";
    document.getElementById("ov-repos").innerHTML = "";
    document.getElementById("ov-ft").textContent = "Vraag de sleutel na bij je team.";

    const list = document.getElementById("ov-list");
    list.innerHTML =
      '<div class="steps">Om namen voor iedereen te wijzigen heb je de teamsleutel nodig. ' +
      "Kijken en openen kan zonder.</div>";

    const wrap = document.createElement("div");
    wrap.className = "steps";
    wrap.style.display = "flex";
    wrap.style.gap = "8px";
    wrap.style.paddingTop = "0";

    const inp = document.createElement("input");
    inp.type = "password";
    inp.placeholder = "Teamsleutel";
    inp.style.cssText =
      "flex:1;height:34px;padding:0 10px;font:400 14px 'Poppins',system-ui,sans-serif;" +
      "border:1px solid var(--border-base);border-radius:var(--radius-base);outline:none;";

    const ok = document.createElement("button");
    ok.className = "pages-btn";
    ok.textContent = "Bewaren";

    const done = value => {
      if (value) { try { localStorage.setItem(KEYSTORE, value); } catch (e) {} }
      closeModal();
      resolve(value || null);
    };
    ok.onclick = () => done(inp.value.trim());
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); done(inp.value.trim()); } };

    wrap.append(inp, ok);
    list.append(wrap);

    lastFocus = document.activeElement;
    ov.classList.add("is-open");
    document.body.style.overflow = "hidden";
    inp.focus();
  });
}

const ICON = {
  ext: '<svg viewBox="0 0 16 16" fill="none"><path d="M6 3H3.5A1.5 1.5 0 002 4.5v8A1.5 1.5 0 003.5 14h8a1.5 1.5 0 001.5-1.5V10M9.5 2H14v4.5M14 2L7.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  none: '<svg viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M8 3.5c3.2 0 5.6 2.4 6.5 4.5-.4 1-1.2 2.1-2.2 2.9M4.6 4.7C3.3 5.6 2.3 6.9 1.5 8c.9 2.1 3.3 4.5 6.5 4.5 1 0 1.9-.2 2.7-.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  book: '<svg viewBox="0 0 20 20" fill="none"><path d="M3 4.5A1.5 1.5 0 014.5 3H9v14H4.5A1.5 1.5 0 013 15.5v-11zM17 4.5A1.5 1.5 0 0015.5 3H11v14h4.5A1.5 1.5 0 0017 15.5v-11z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  wrench: '<svg viewBox="0 0 20 20" fill="none"><path d="M12.5 3a4 4 0 00-3.8 5.2L3 13.9V17h3l5.7-5.7A4 4 0 1012.5 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  pages: '<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 4V3.5A1.5 1.5 0 016.5 2h6A1.5 1.5 0 0114 3.5v6a1.5 1.5 0 01-1.5 1.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  close: '<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  pencil: '<svg viewBox="0 0 16 16" fill="none"><path d="M11.5 2.5l2 2L6 12l-2.5.5L4 10l7.5-7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 4l2 2" stroke="currentColor" stroke-width="1.5"/></svg>'
};

const PEOPLE = {
  Jente: { initials: "JI", full: "Jente Insing", av: "av-blue" },
  Eray:  { initials: "ED", full: "Eray Demirsoy", av: "av-orange" },
  Jamal: { initials: "JR", full: "Jamal van Rooijen", av: "av-turquoise" }
};
function avatar(owner) {
  const p = PEOPLE[owner] || { initials: owner.slice(0, 2).toUpperCase(), full: owner, av: "av-grey" };
  return '<span class="av av-24 ' + p.av + '" title="' + p.full + '">' + p.initials + "</span>";
}

function orgClass(org) {
  if (org === "effectory-ux") return "org-ux";
  if (org === "effectory-design") return "org-design";
  if (org === "eray-effectory") return "org-eray";
  return "org-jamal";
}

const owners = [...new Set(DATA.map(d => d.owner))].sort();
const groups = [...new Set(DATA.map(d => d.group))];
let activeOwner = null, activeGroup = null, query = "";

function matches(d) {
  if (activeOwner && d.owner !== activeOwner) return false;
  if (activeGroup && d.group !== activeGroup) return false;
  if (query) {
    const hay = (nameOf(d) + " " + d.name + " " + d.desc + " " + d.path + " " + d.owner + " " + d.group + " " +
      d.pages.join(" ") + " " + d.repos.map(r => r.org + "/" + r.name).join(" ")).toLowerCase();
    if (!query.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function chip(label, n, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " is-on" : "");
  b.innerHTML = label + ' <span class="chip-n">' + n + "</span>";
  b.onclick = onClick;
  return b;
}

function renderFilters() {
  const f = document.getElementById("filters");
  f.innerHTML = "";
  f.appendChild(chip("Alles", DATA.length, !activeOwner && !activeGroup, () => {
    activeOwner = activeGroup = null; render();
  }));
  const s1 = document.createElement("div"); s1.className = "filters-sep"; f.appendChild(s1);
  owners.forEach(o => f.appendChild(chip(o, DATA.filter(d => d.owner === o).length, activeOwner === o, () => {
    activeOwner = activeOwner === o ? null : o; render();
  })));
  const s2 = document.createElement("div"); s2.className = "filters-sep"; f.appendChild(s2);
  groups.forEach(g => f.appendChild(chip(g, DATA.filter(d => d.group === g).length, activeGroup === g, () => {
    activeGroup = activeGroup === g ? null : g; render();
  })));
}

/* Thumbnails only load once their card comes near the viewport. */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const t = e.target, url = t.dataset.live;
    if (!url || t.dataset.done) return;
    t.dataset.done = "1";
    const fr = document.createElement("iframe");
    fr.loading = "lazy";
    // Scripts may run so the page renders, but without allow-top-navigation an
    // embedded prototype cannot take over this window.
    fr.setAttribute("sandbox", "allow-scripts allow-same-origin");
    fr.setAttribute("scrolling", "no");
    fr.setAttribute("tabindex", "-1");
    fr.setAttribute("aria-hidden", "true");
    fr.src = url;
    fr.onload = () => t.classList.add("is-loaded");
    t.prepend(fr);
    io.unobserve(t);
  });
}, { rootMargin: "400px 0px" });

function card(d) {
  const el = document.createElement("div");
  el.className = "card";

  const thumb = document.createElement("a");
  thumb.className = "thumb";
  thumb.href = d.live || d.code;
  thumb.target = "_blank";
  thumb.rel = "noopener";
  if (d.live) {
    thumb.dataset.live = d.live;
    thumb.innerHTML =
      '<div class="thumb-skel">Laden</div>' +
      '<div class="open-ov"><span class="open-pill">' + ICON.ext + " Openen</span></div>";
    io.observe(thumb);
  } else {
    thumb.innerHTML =
      '<div class="thumb-none">' + ICON.none + "<span>Geen live preview</span></div>" +
      '<div class="open-ov"><span class="open-pill">' + ICON.ext + " Bekijk code</span></div>";
  }

  const body = document.createElement("div");
  body.className = "card-body";

  const hd = document.createElement("div");
  hd.className = "card-hd";
  const t = document.createElement("span");
  t.className = "card-t";
  t.textContent = nameOf(d);
  const pen = document.createElement("button");
  pen.className = "card-edit";
  pen.title = "Naam wijzigen";
  pen.setAttribute("aria-label", "Naam wijzigen");
  pen.innerHTML = ICON.pencil;
  pen.onclick = () => startRename(el, t, d);
  hd.append(t, pen);
  if (renames[d.id]) el.classList.add("is-renamed");

  const desc = document.createElement("div");
  desc.className = "card-d";
  desc.textContent = d.desc;

  const meta = document.createElement("div");
  meta.className = "card-meta";
  meta.innerHTML = avatar(d.owner);

  // One button per card, also when there is a single page: the modal is where the
  // repo lives, so it has to stay reachable from every card.
  const n = d.variants && d.variants.length ? d.variants.length : 1;
  const btn = document.createElement("button");
  btn.className = "btn btn-link btn-xs meta-right";
  btn.innerHTML = '<i data-icon="copy"></i>' + (n === 1 ? "1 pagina" : n + " pagina's");
  btn.onclick = () => openModal(d);
  meta.append(btn);


  body.append(hd, desc, meta);
  el.append(thumb, body);
  return el;
}

function render() {
  renderFilters();
  const shown = DATA.filter(matches);
  document.getElementById("count").textContent =
    shown.length === DATA.length
      ? DATA.length + " prototypes"
      : shown.length + " van " + DATA.length + " prototypes";

  const host = document.getElementById("sections");
  host.innerHTML = "";
  if (!shown.length) {
    host.innerHTML = '<div class="empty">Niets gevonden. Pas je zoekterm of filter aan.</div>';
    return;
  }
  const secs = [];
  shown.forEach(d => {
    let g = secs.find(x => x.name === d.group);
    if (!g) secs.push(g = { name: d.group, items: [] });
    g.items.push(d);
  });
  secs.forEach(g => {
    const sec = document.createElement("div");
    sec.className = "sec";
    const hd = document.createElement("div");
    hd.className = "sec-hd";
    hd.innerHTML = '<span class="sec-t">' + g.name + '</span><span class="sec-n">' +
      g.items.length + '</span><span class="sec-line"></span>';
    const grid = document.createElement("div");
    grid.className = "grid";
    g.items.forEach(d => grid.appendChild(card(d)));
    sec.append(hd, grid);
    host.appendChild(sec);
  });
  scale();
  if (window.Icons) window.Icons.render();
}

function renderHero() {
  document.getElementById("dsbtn").href = DS.docs;
  document.getElementById("foot-src").innerHTML =
    'Zelf een prototype bouwen? <a href="' + DS.guide + '" target="_blank" rel="noopener">' +
    'installeer de skill</a>.<br />Bronnen: ' + REPOS.map(r =>
    '<a href="https://github.com/' + r.repo + '" target="_blank" rel="noopener">' + r.repo + "</a>"
  ).join(" · ");
}

/* ── Renaming a card ── */
function startRename(cardEl, titleEl, d) {
  if (titleEl.querySelector("input")) return;
  const before = nameOf(d);
  const inp = document.createElement("input");
  inp.value = before;
  inp.setAttribute("aria-label", "Nieuwe naam");
  titleEl.textContent = "";
  titleEl.append(inp);
  inp.focus();
  inp.select();

  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const next = inp.value.trim();
    if (commit) {
      if (next && next !== d.name) renames[d.id] = next;
      else delete renames[d.id];
      saveRenames();
    }
    titleEl.textContent = nameOf(d);
    cardEl.classList.toggle("is-renamed", !!renames[d.id]);
  };

  inp.onblur = () => finish(true);
  inp.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  };
}

/* ── Publishing renames back to prototypes.json ── */
function renamedConfig() {
  const cfg = JSON.parse(JSON.stringify(CONFIG));
  cfg.entries.forEach(e => {
    const id = e.repo + "::" + e.path;
    if (renames[id]) e.name = renames[id];
  });
  return JSON.stringify(cfg, null, 2) + "\n";
}

function renderPub() {
  const bar = document.getElementById("pub");
  const txt = document.getElementById("pub-txt");
  const go = document.getElementById("pub-go");
  const undo = document.getElementById("pub-undo");
  const n = Object.keys(renames).length;

  if (SYNC) {
    // Names save themselves; the bar only reports what happened.
    go.hidden = true;
    undo.hidden = syncState !== "failed";
    undo.textContent = "Opnieuw proberen";
    undo.onclick = () => push();
    txt.textContent =
      syncState === "saving" ? "Opslaan" :
      syncState === "saved" ? "Opgeslagen voor iedereen" :
      syncState === "failed" ? "Niet opgeslagen" : "";
    bar.classList.toggle("is-on", syncState === "saving" || syncState === "saved" || syncState === "failed");
    return;
  }

  go.hidden = false;
  undo.hidden = false;
  undo.textContent = "Ongedaan maken";
  undo.onclick = () => { renames = {}; saveRenames(); render(); };
  txt.textContent = n === 1 ? "1 naam gewijzigd" : n + " namen gewijzigd";
  bar.classList.toggle("is-on", n > 0);
}

async function publish() {
  const json = renamedConfig();
  let copied = false;
  try { await navigator.clipboard.writeText(json); copied = true; } catch (e) {}

  const n = Object.keys(renames).length;
  document.getElementById("ov-title").textContent = "Publiceren voor iedereen";
  document.getElementById("ov-sub").textContent =
    (n === 1 ? "1 gewijzigde naam" : n + " gewijzigde namen") + " · prototypes.json";
  document.getElementById("ov-repos").innerHTML = "";
  document.getElementById("ov-ft").textContent =
    "Je wijzigingen blijven in deze browser staan tot je ze publiceert.";

  const list = document.getElementById("ov-list");
  list.innerHTML =
    '<div class="steps"><ol>' +
      "<li>" + (copied
        ? '<span class="done">De nieuwe prototypes.json staat op je klembord.</span>'
        : 'Kopieer de nieuwe <code>prototypes.json</code> met de knop hieronder.') + "</li>" +
      "<li>Klik op <strong>GitHub-editor openen</strong>. Die opent in een nieuw tabblad.</li>" +
      "<li>Selecteer alles in het bestand (<code>Cmd + A</code>) en plak (<code>Cmd + V</code>).</li>" +
      "<li>Klik op <strong>Commit changes</strong>. Binnen een minuut ziet iedereen de nieuwe namen.</li>" +
    "</ol></div>";

  const bar = document.createElement("div");
  bar.className = "steps";
  bar.style.display = "flex";
  bar.style.gap = "8px";
  bar.style.paddingTop = "0";

  const copy = document.createElement("button");
  copy.className = "pages-btn";
  copy.textContent = copied ? "Nogmaals kopiëren" : "Kopieer JSON";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(json); copy.textContent = "Gekopieerd"; }
    catch (e) { copy.textContent = "Kopiëren mislukt"; }
  };

  const open = document.createElement("a");
  open.className = "pages-btn";
  open.href = "https://github.com/" + GALLERY_REPO + "/edit/main/prototypes.json";
  open.target = "_blank";
  open.rel = "noopener";
  open.textContent = "GitHub-editor openen";

  bar.append(copy, open);
  list.append(bar);

  lastFocus = document.activeElement;
  ov.classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.getElementById("ov-close").focus();
}

/* ── Modal listing every page of one prototype ── */
const ov = document.getElementById("ov");
let lastFocus = null;

function openModal(d) {
  lastFocus = document.activeElement;
  const pages = d.variants && d.variants.length
    ? d.variants
    : [{ label: d.name, live: d.live, code: d.code }];

  document.getElementById("ov-title").textContent = nameOf(d);
  document.getElementById("ov-sub").textContent =
    (pages.length === 1 ? "1 pagina" : pages.length + " pagina's") + " · " + d.owner;

  document.getElementById("ov-repos").innerHTML = d.repos.map(r =>
    '<span class="tag repo ' + orgClass(r.org) + '">' +
    '<span class="tag-dot"></span><span>' + r.org + "/" + r.name + "</span></span>"
  ).join("");

  document.getElementById("ov-ft").textContent = "Elke pagina opent in een nieuw tabblad.";

  const list = document.getElementById("ov-list");
  list.innerHTML = "";
  pages.forEach((v, i) => {
    const a = document.createElement("a");
    a.className = "modal-row";
    a.href = v.live || v.code;
    a.target = "_blank";
    a.rel = "noopener";
    const label = document.createElement("div");
    label.innerHTML = '<div class="modal-lbl"></div><div class="modal-path"></div>';
    label.querySelector(".modal-lbl").textContent = v.label;
    label.querySelector(".modal-path").textContent =
      (v.live || v.code).split("/").pop() || v.label;
    a.innerHTML = '<span class="modal-num">' + (i + 1) + "</span>";
    a.append(label);
    const open = document.createElement("span");
    open.className = "modal-open";
    open.innerHTML = ICON.ext + (v.live ? "Openen" : "Code");
    a.append(open);
    list.append(a);
  });

  ov.classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.getElementById("ov-close").focus();
}

function closeModal() {
  ov.classList.remove("is-open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

document.getElementById("ov-close").innerHTML = ICON.close;
document.getElementById("ov-close").onclick = closeModal;
ov.addEventListener("click", e => { if (e.target === ov) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ov.classList.contains("is-open")) closeModal();
});

/* Each thumbnail renders a 1440px-wide viewport, scaled down to the card width. */
function scale() {
  const t = document.querySelector(".thumb");
  if (!t) return;
  document.documentElement.style.setProperty("--s", (t.clientWidth / 1440).toFixed(4));
}

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});
window.addEventListener("resize", scale);

document.getElementById("pub-go").onclick = publish;

renderHero();
render();
renderPub();
pullFile();
pull();
</script>
</body>
</html>
