<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects · Effectory UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://effectory-ux.github.io/Engage-Design-system-/tokens.css" />
<link rel="stylesheet" href="https://effectory-ux.github.io/Engage-Design-system-/foundation.css" />
<link rel="stylesheet" href="https://effectory-ux.github.io/Engage-Design-system-/components.css" />
<script src="https://effectory-ux.github.io/Engage-Design-system-/icons.js"></script>
<style>
  * { box-sizing: border-box; }
  html { background: #fdfdfc; }
  body {
    margin: 0;
    position: relative;
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--content-base);
  }

  /* A ball of the design system's yellow, travelling across the viewport and
     breathing as it goes. Fixed and animated on transform only, so the page content
     never repaints. */
  body::before {
    content: "";
    position: fixed; top: 0; left: 0;
    width: 150vmin; height: 150vmin;
    margin: -75vmin 0 0 -75vmin;
    z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 45% 40%,
      rgba(255,216,87,0.60) 0%,
      rgba(255,224,120,0.42) 45%,
      rgba(254,242,203,0.22) 80%,
      rgba(254,242,203,0.10) 100%);
    filter: blur(48px);
    animation:
      glow-ball 16s ease-in-out infinite alternate,
      glow-morph 21s ease-in-out infinite alternate,
      glow-fade 37s ease-in-out infinite alternate;
    will-change: transform, border-radius, opacity;
  }
  @keyframes glow-ball {
    0%   { transform: translate3d(12vw, 10vh, 0) scale(0.90) rotate(0deg); }
    35%  { transform: translate3d(50vw, 0vh, 0)  scale(1.35) rotate(45deg); }
    70%  { transform: translate3d(82vw, 30vh, 0) scale(1.05) rotate(95deg); }
    100% { transform: translate3d(100vw, 6vh, 0) scale(1.30) rotate(160deg); }
  }
  /* The silhouette itself flows: opposing corner radii pulling in turn. */
  @keyframes glow-morph {
    0%   { border-radius: 58% 42% 46% 54% / 54% 46% 54% 46%; }
    25%  { border-radius: 42% 58% 62% 38% / 38% 62% 38% 62%; }
    50%  { border-radius: 66% 34% 38% 62% / 62% 40% 60% 38%; }
    75%  { border-radius: 38% 62% 56% 44% / 44% 56% 44% 56%; }
    100% { border-radius: 52% 48% 60% 40% / 60% 38% 62% 40%; }
  }
  /* A second ball on the same path in brand turquoise (--bg-brand, #0a9d99), fading in
     and out over a longer cycle so the colour drifts from yellow to teal and back.
     Literal rgba because a gradient stop needs alpha, not a token. */
  body::after {
    content: "";
    position: fixed; top: 0; left: 0;
    width: 150vmin; height: 150vmin;
    margin: -75vmin 0 0 -75vmin;
    z-index: -1; pointer-events: none;
    /* Straight --bg-brand (#0a9d99), no lighter turquoise mixed in, so what you see
       is the brand colour. */
    background: radial-gradient(circle at 45% 40%,
      rgba(10,157,153,0.55) 0%,
      rgba(10,157,153,0.38) 45%,
      rgba(10,157,153,0.18) 80%,
      rgba(10,157,153,0.08) 100%);
    filter: blur(48px);
    opacity: 0;
    animation:
      glow-ball 16s ease-in-out infinite alternate,
      glow-morph 21s ease-in-out infinite alternate,
      glow-tint 37s ease-in-out infinite alternate;
    will-change: transform, border-radius, opacity;
  }
  @keyframes glow-tint {
    0%   { opacity: 0; }
    40%  { opacity: 0.35; }
    100% { opacity: 1; }
  }
  /* The yellow steps back as the teal comes up, so the two never sit on top of each
     other at full strength and turn olive. */
  @keyframes glow-fade {
    0%   { opacity: 1; }
    60%  { opacity: 0.25; }
    100% { opacity: 0; }
  }

  /* Anyone who asked their system for less motion gets the ball standing still. */
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { animation: none; transform: translate3d(70vw, 10vh, 0); }
    body::after { opacity: .5; }
  }

  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) { background: var(--bg-interface-body-secondary); }
    html:not([data-theme="light"]) body::before {
      background: radial-gradient(circle at 50% 50%,
        rgba(255,216,87,0.20) 0%, rgba(255,224,120,0.10) 35%, rgba(0,0,0,0) 70%);
    }
  }
  html[data-theme="dark"] { background: var(--bg-interface-body-secondary); }
  html[data-theme="dark"] body::before {
    background: radial-gradient(circle at 50% 50%,
      rgba(255,216,87,0.20) 0%, rgba(255,224,120,0.10) 35%, rgba(0,0,0,0) 70%);
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body::after {
      background: radial-gradient(circle at 45% 40%,
        rgba(10,157,153,0.30) 0%, rgba(10,157,153,0.16) 45%, rgba(10,157,153,0.05) 85%);
    }
  }
  html[data-theme="dark"] body::after {
    background: radial-gradient(circle at 45% 40%,
      rgba(10,157,153,0.30) 0%, rgba(10,157,153,0.16) 45%, rgba(10,157,153,0.05) 85%);
  }

  a { color: inherit; text-decoration: none; }

  /* ── Page head ── */
  .page-head {
    display: flex; align-items: center; gap: var(--spacing-base);
  }
  .page-title { display: flex; align-items: center; gap: var(--spacing-tight); margin-right: auto; }
  .page-title h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  /* The Effectory logo, supplied by Jente; it carries its own yellow and radius. */
  .brand-mark { display: flex; flex: none; }
  .brand-mark img { display: block; width: 40px; height: 40px; }

  /* Search spans the content width, on its own line. */
  .search-row {
    display: flex;
    margin: var(--spacing-super-extra-loose) 0 var(--spacing-super-loose);
  }
  .search-wrap { width: 100%; }

  /* ── Filters ── */
  /* Left-aligned and close to the grid: the pills filter the content below them,
     so they belong with it rather than with the centred search. */
  .filters {
    display: flex; flex-wrap: wrap; gap: var(--spacing-tight);
    margin-bottom: var(--spacing-loose);
  }
  .fpill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 var(--spacing-base-tight);
    font: 500 14px 'Poppins', system-ui, sans-serif;
    color: var(--content-secondary);
    background: var(--bg-base);
    border: 1px solid var(--border-base);
    border-radius: var(--radius-full);
    cursor: pointer;
  }
  .fpill:hover { background: var(--bg-secondary); color: var(--content-base); }
  /* Selected reads like the primary button: filled brand, white label. */
  .fpill.is-on {
    color: var(--content-always-white);
    background: var(--bg-brand);
    border-color: var(--bg-brand);
  }
  .fpill.is-on:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); color: var(--content-always-white); }
  .fpill.is-on .fpill-n { color: var(--content-always-white); opacity: .75; }
  .fpill-n { font-weight: 400; color: var(--content-subtle); }
  .filters-sep { width: 1px; background: var(--border-base); margin: 4px var(--spacing-extra-tight); }

  .wrap {
    /* 80px = super-extra-loose (56) + loose (24), the way the design system homepage
       composes its 80/96px. */
    padding:
      var(--spacing-super-extra-loose)
      calc(var(--spacing-super-extra-loose) + var(--spacing-loose))
      calc(var(--spacing-super-extra-loose) + var(--spacing-super-loose));
    max-width: 1600px; margin: 0 auto;
  }

  /* ── Sections ── */
  .sec { margin-bottom: var(--spacing-super-extra-loose); }
  .sec-hd { display: flex; align-items: center; gap: var(--spacing-base-tight); margin-bottom: var(--spacing-loose); }
  .sec-t { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .sec-n { font-size: 14px; color: var(--content-secondary); }
  .sec-line { flex: 1; height: 1px; background: var(--border-base); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--spacing-extra-loose); }

  /* ── Card ── */
  .card {
    display: flex; flex-direction: column;
    padding: var(--spacing-tight);
    background: var(--bg-base);
    border: 1px solid var(--border-base);
    border-radius: var(--radius-xl);
    box-shadow: var(--sh-card);
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card:hover { box-shadow: var(--sh-card-hover); transform: translateY(-2px); border-color: var(--border-base-hover); }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--bg-subtle, var(--bg-secondary));
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: block;
  }
  .thumb iframe {
    position: absolute; top: 0; left: 0;
    width: 1440px; height: 900px;
    border: 0;
    transform-origin: 0 0;
    transform: scale(var(--s, .22));
    pointer-events: none;
    background: var(--bg-base);
  }
  .thumb-skel {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 12px; color: var(--content-subtle);
    background: var(--bg-secondary);
  }
  .thumb.is-loaded .thumb-skel { display: none; }
  .thumb-none {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--content-subtle);
    background: repeating-linear-gradient(45deg,
      var(--bg-secondary) 0 10px, var(--bg-secondary-hover) 10px 20px);
  }
  .thumb-none i { display: flex; width: 20px; height: 20px; opacity: .5; }

  .open-ov {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(25, 39, 67, .5);
    opacity: 0; transition: opacity .15s ease;
  }
  .card:hover .open-ov { opacity: 1; }
  .open-pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 var(--spacing-base);
    font-size: 14px; font-weight: 600;
    color: var(--content-base);
    background: var(--bg-base);
    border-radius: var(--radius-full);
    box-shadow: var(--sh-popovers);
  }
  .open-pill i { display: flex; width: 14px; height: 14px; }

  .card-body {
    padding: var(--spacing-base-tight) var(--spacing-tight) var(--spacing-tight);
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-tight);
    flex: 1;
  }
  .card-hd { display: flex; align-items: flex-start; gap: 6px; width: 100%; }
  .card-t { font-size: 14px; font-weight: 600; line-height: 1.35; flex: 1; }
  .card-d {
    font-size: 12px; color: var(--content-secondary); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Track label: the design system chip, coloured per track. */
  .chip.track-surveying { background: var(--bg-accent-blue-subtle); color: var(--content-accent-blue); }
  .chip.track-leadership { background: var(--bg-accent-orange-subtle); color: var(--content-accent-orange); }
  .chip.track-reporting { background: var(--bg-accent-turquoise-subtle); color: var(--content-accent-turquoise); }
  .chip.track-ux { background: var(--bg-accent-purple-subtle); color: var(--content-base); }
  .chip.track-platform { background: var(--bg-secondary); color: var(--content-secondary); }

  .card-meta { display: flex; align-items: center; gap: var(--spacing-tight); width: 100%; margin-top: auto; }
  .card-meta .av { cursor: default; }
  .card-by { font-size: 12px; color: var(--content-secondary); }

  /* Only the layer around it; the panel itself is the .dialog component. */
  .ov {
    position: fixed; inset: 0; z-index: 90;
    display: none; align-items: center; justify-content: center;
    padding: var(--spacing-loose);
    background: rgba(25, 39, 67, .45);
  }
  .ov.is-open { display: flex; }
  .ov .dialog { max-height: 80vh; gap: var(--spacing-base); }

  /* Frame around the list, the way the docs frame .list-item. */
  .list-frame {
    border: 1px solid var(--border-base);
    border-radius: var(--radius-lg);
    overflow: auto;
    background: var(--bg-base);
    max-height: 46vh;
  }
  .ov .list-item { min-height: 56px; padding: var(--spacing-base-tight) var(--spacing-base); gap: var(--spacing-base-tight); }
  .list-item-num {
    flex: none; display: grid; place-items: center;
    width: 24px; height: 24px;
    font-size: 12px; font-weight: 600;
    color: var(--content-secondary);
    background: var(--bg-secondary);
    border-radius: var(--radius-full);
  }
  .list-item.is-interactive:hover .list-item-num { background: var(--bg-brand-subtle); color: var(--content-brand); }
  .ov .list-item-title { font-size: 14px; }
  .ov .list-item-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .list-item-trailing i { display: flex; width: 14px; height: 14px; color: var(--content-secondary); }

  .steps { font-size: 14px; line-height: 1.6; color: var(--content-secondary); }
  .steps ol { margin: 0; padding-left: var(--spacing-base); }
  .steps li { margin-bottom: 6px; }
  .steps code { font-size: 12px; background: var(--bg-secondary); padding: 1px 5px; border-radius: var(--radius-sm); }
  .steps .done { color: var(--content-positive); font-weight: 500; }

  /* ── Renaming ── */
  .card-edit {
    flex: none; display: grid; place-items: center;
    width: 24px; height: 24px; margin: -2px -4px 0 0;
    border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--content-subtle);
    cursor: pointer; opacity: 0;
    transition: opacity .12s ease;
  }
  .card:hover .card-edit, .card-edit:focus { opacity: 1; }
  .card-edit:hover { background: var(--bg-secondary); color: var(--content-base); }
  .card-edit i { display: flex; width: 13px; height: 13px; }

  .card-t input {
    width: 100%;
    font: 600 16px 'Poppins', system-ui, sans-serif;
    color: var(--content-base);
    background: var(--bg-base);
    border: 1px solid var(--border-action);
    border-radius: var(--radius-sm);
    padding: 2px 6px; margin: -3px -7px;
    outline: none;
    box-shadow: var(--sh-action);
  }
  .card.is-renamed .card-t::after {
    content: "hernoemd";
    display: inline-block; margin-left: 6px; vertical-align: middle;
    padding: 1px 6px;
    font-size: 12px; font-weight: 500;
    color: var(--content-highlight);
    background: var(--bg-highlight-subtle);
    border-radius: var(--radius-full);
  }

  .pub {
    position: fixed; left: 50%; bottom: var(--spacing-loose); z-index: 50;
    transform: translateX(-50%) translateY(140%);
    opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: var(--spacing-base-tight);
    padding: var(--spacing-base-tight) var(--spacing-base-tight) var(--spacing-base-tight) var(--spacing-base);
    background: var(--bg-inverse);
    color: var(--content-inverse);
    border-radius: var(--radius-full);
    box-shadow: var(--sh-dialogs);
    transition: transform .2s ease, opacity .2s ease;
  }
  .pub.is-on { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
  .pub-txt { font-size: 14px; font-weight: 500; }
  .pub-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 var(--spacing-base-tight);
    font: 500 14px 'Poppins', system-ui, sans-serif;
    border: 0; border-radius: var(--radius-full);
    background: var(--bg-base); color: var(--content-base);
    cursor: pointer;
  }
  .pub-btn:hover { background: var(--bg-secondary); }
  .pub-btn.ghost { background: transparent; color: var(--content-inverse); opacity: .8; }
  .pub-btn.ghost:hover { background: rgba(255,255,255,.14); opacity: 1; }

  .steps { padding: var(--spacing-base); font-size: 14px; line-height: 1.6; }
  .steps ol { margin: 0; padding-left: var(--spacing-base); }
  .steps li { margin-bottom: 6px; }
  .steps code { font-size: 12px; background: var(--bg-secondary); padding: 1px 5px; border-radius: var(--radius-sm); }
  .steps .done { color: var(--content-positive); font-weight: 500; }

  .empty { padding: var(--spacing-super-loose); text-align: center; color: var(--content-secondary); font-size: 14px; }


  @media (max-width: 1100px) {
    .wrap { padding: var(--spacing-loose) var(--spacing-extra-loose) var(--spacing-super-loose); }
  }
  @media (max-width: 720px) {
    .wrap { padding: var(--spacing-base); }
    .page-head { flex-wrap: wrap; }
    .page-title { width: 100%; }
    .search { flex: 1; width: auto; }
  }
</style>
</head>
<body>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ov-title">
  <div class="dialog dialog-s">
    <button class="dialog-close" id="ov-close" aria-label="Close"><i data-icon="cross"></i></button>
    <div class="dialog-header">
      <h3 class="dialog-title" id="ov-title"></h3>
      <p class="dialog-subtitle" id="ov-sub"></p>
    </div>
    <div class="dialog-body modal-list" id="ov-list"></div>
    <p class="dialog-subtitle" id="ov-ft"></p>
  </div>
</div>

<div class="pub" id="pub">
  <span class="pub-txt" id="pub-txt"></span>
  <button class="pub-btn" id="pub-go">Publish</button>
  <button class="pub-btn ghost" id="pub-undo">Undo</button>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">
      <span class="brand-mark"><img src="assets/effectory-logo.svg" alt="Effectory" /></span>
      <h1>Projects</h1>
    </div>
    <a class="btn btn-primary" id="dsbtn" href="#" target="_blank" rel="noopener">
      <i data-icon="book-open"></i>
      Design system
    </a>
  </div>

  <div class="search-row">
    <div class="search-wrap is-lg">
      <div class="search-icon"><i data-icon="search"></i></div>
      <input id="q" type="search" class="srch srch-lg" placeholder="Search by name or repo" autocomplete="off" />
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="sections"></div>
</div>

<script>
const DATA = /*__DATA__*/;
const DS = /*__DS__*/;
const REPOS = /*__REPOS__*/;
const CONFIG = /*__CONFIG__*/;
const GALLERY_REPO = "effectory-ux/prototypes";

/* Filter pills are parked, not removed: the state and the matching below stay live,
   so flipping this back shows them again. Search still filters. */
const SHOW_FILTERS = true;

/* Renames are shared through the worker in CONFIG.sync.url: a name typed here is
   what the next visitor sees. Without that URL they stay in this browser and are
   published to prototypes.json by hand. */
const SYNC = (CONFIG.sync && CONFIG.sync.url) || "";
const STORE = "effx-gallery-names";
const KEYSTORE = "effx-gallery-key";

let renames = {};
try { renames = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { renames = {}; }

const nameOf = d => renames[d.id] || d.name;

/* "Updated 3 days ago", worked out in the browser so a built page never goes stale. */
function sinds(iso) {
  if (!iso) return "";
  const dagen = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (dagen <= 0) return "Updated today";
  if (dagen === 1) return "Updated yesterday";
  if (dagen < 30) return "Updated " + dagen + " days ago";
  const maanden = Math.round(dagen / 30);
  return "Updated " + maanden + (maanden === 1 ? " month ago" : " months ago");
}

function saveLocal() {
  try { localStorage.setItem(STORE, JSON.stringify(renames)); } catch (e) {}
}

function saveRenames() {
  saveLocal();
  if (SYNC) push();
  renderPub();
}

/* ── Sharing through the worker ── */
let syncState = SYNC ? "idle" : "off";   // idle | saving | saved | failed | off
let pushing = false, dirty = false;

/* index.html is generated, so a name committed to prototypes.json would not show
   up until the next build. Read that file at load instead: publishing a rename is
   then a single commit, no regeneration needed. */
async function pullFile() {
  try {
    const res = await fetch("prototypes.json", { cache: "no-store" });
    if (!res.ok) return;
    const cfg = await res.json();
    if (!cfg || !Array.isArray(cfg.entries)) return;

    const published = {};
    cfg.entries.forEach(e => { published[e.repo + "::" + e.path] = e.name; });

    let changed = false;
    DATA.forEach(d => {
      const name = published[d.id];
      if (!name || name === d.name) return;
      d.name = name;                       // what everyone sees
      if (renames[d.id] === name) {        // my local edit is now the published one
        delete renames[d.id];
        saveLocal();
      }
      changed = true;
    });
    if (changed) { render(); renderPub(); }
  } catch (e) {
    // Falls back to the names baked into the page.
  }
}

async function pull() {
  if (!SYNC) return;
  try {
    const res = await fetch(SYNC + "/names", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const shared = await res.json();
    if (shared && typeof shared === "object") {
      renames = shared;
      saveLocal();
      render();
    }
  } catch (e) {
    // Offline or worker down: the names from localStorage stay on screen.
  }
}

async function push() {
  if (!SYNC) return;
  if (pushing) { dirty = true; return; }
  const key = await editKey();
  if (!key) { syncState = "failed"; renderPub(); return; }

  pushing = true;
  syncState = "saving";
  renderPub();
  try {
    const res = await fetch(SYNC + "/names", {
      method: "PUT",
      headers: { "content-type": "application/json", "x-edit-key": key },
      body: JSON.stringify(renames),
    });
    if (res.status === 401) {
      try { localStorage.removeItem(KEYSTORE); } catch (e) {}
      throw new Error("unauthorized");
    }
    if (!res.ok) throw new Error(res.status);
    syncState = "saved";
    setTimeout(() => { if (syncState === "saved") { syncState = "idle"; renderPub(); } }, 2500);
  } catch (e) {
    syncState = "failed";
  }
  pushing = false;
  renderPub();
  if (dirty) { dirty = false; push(); }
}

/* The key is a shared passphrase, asked once per browser, so a random visitor
   cannot rename things. Reading the gallery never needs it. */
function editKey() {
  let stored = null;
  try { stored = localStorage.getItem(KEYSTORE); } catch (e) {}
  if (stored) return Promise.resolve(stored);

  return new Promise(resolve => {
    document.getElementById("ov-title").textContent = "Enter the key";
    document.getElementById("ov-sub").textContent = "Once per browser, then never again";
    document.getElementById("ov-ft").textContent = "Ask your team for the key.";

    const list = document.getElementById("ov-list");
    list.innerHTML =
      '<div class="steps">Changing names for everyone needs the team key. ' +
      "Viewing and opening works without it.</div>";

    const wrap = document.createElement("div");
    wrap.className = "steps";
    wrap.style.display = "flex";
    wrap.style.gap = "8px";
    wrap.style.paddingTop = "0";

    const inp = document.createElement("input");
    inp.type = "password";
    inp.placeholder = "Team key";
    inp.style.cssText =
      "flex:1;height:34px;padding:0 10px;font:400 14px 'Poppins',system-ui,sans-serif;" +
      "border:1px solid var(--border-base);border-radius:var(--radius-base);outline:none;";

    const ok = document.createElement("button");
    ok.className = "pages-btn";
    ok.textContent = "Save";

    const done = value => {
      if (value) { try { localStorage.setItem(KEYSTORE, value); } catch (e) {} }
      closeModal();
      resolve(value || null);
    };
    ok.onclick = () => done(inp.value.trim());
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); done(inp.value.trim()); } };

    wrap.append(inp, ok);
    list.append(wrap);

    lastFocus = document.activeElement;
    ov.classList.add("is-open");
    document.body.style.overflow = "hidden";
    inp.focus();
  });
}


const TRACK_CLASS = {
  "Surveying": "track-surveying",
  "Leadership enablement": "track-leadership",
  "Reporting": "track-reporting",
  "UX": "track-ux",
  "Platform": "track-platform"
};

const PEOPLE = {
  Jente: { initials: "JI", full: "Jente Insing", av: "av-blue" },
  Eray:  { initials: "ED", full: "Eray Demirsoy", av: "av-orange" },
  Jamal: { initials: "JR", full: "Jamal van Rooijen", av: "av-turquoise" }
};
function avatar(owner) {
  const p = PEOPLE[owner] || { initials: owner.slice(0, 2).toUpperCase(), full: owner, av: "av-grey" };
  return '<span class="av av-24 ' + p.av + '" title="' + p.full + '">' + p.initials + "</span>";
}

const owners = [...new Set(DATA.map(d => d.owner))].sort();
const groups = [...new Set(DATA.map(d => d.group))];
let activeOwner = null, activeGroup = null, query = "";

function matches(d) {
  if (activeOwner && d.owner !== activeOwner) return false;
  if (activeGroup && d.group !== activeGroup) return false;
  if (query) {
    const hay = (nameOf(d) + " " + d.name + " " + d.desc + " " + d.path + " " + d.owner + " " + d.group + " " +
      d.pages.join(" ") + " " + d.repos.map(r => r.org + "/" + r.name).join(" ")).toLowerCase();
    if (!query.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function filterPill(label, n, on, onClick) {
  const b = document.createElement("button");
  b.className = "fpill" + (on ? " is-on" : "");
  b.innerHTML = label + ' <span class="fpill-n">' + n + "</span>";
  b.onclick = onClick;
  return b;
}

function renderFilters() {
  const f = document.getElementById("filters");
  f.innerHTML = "";
  f.appendChild(filterPill("All", DATA.length, !activeGroup, () => {
    activeGroup = null; render();
  }));
  groups.forEach(g => f.appendChild(filterPill(g, DATA.filter(d => d.group === g).length, activeGroup === g, () => {
    activeGroup = activeGroup === g ? null : g; render();
  })));
}

/* Thumbnails only load once their card comes near the viewport. */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const t = e.target, url = t.dataset.live;
    if (!url || t.dataset.done) return;
    t.dataset.done = "1";
    const fr = document.createElement("iframe");
    fr.loading = "lazy";
    // Scripts may run so the page renders, but without allow-top-navigation an
    // embedded prototype cannot take over this window.
    fr.setAttribute("sandbox", "allow-scripts allow-same-origin");
    fr.setAttribute("scrolling", "no");
    fr.setAttribute("tabindex", "-1");
    fr.setAttribute("aria-hidden", "true");
    fr.src = url;
    fr.onload = () => t.classList.add("is-loaded");
    t.prepend(fr);
    io.unobserve(t);
  });
}, { rootMargin: "400px 0px" });

function card(d) {
  const el = document.createElement("div");
  el.className = "card";

  const thumb = document.createElement("a");
  thumb.className = "thumb";
  thumb.href = d.live || d.code;
  thumb.target = "_blank";
  thumb.rel = "noopener";
  if (d.live) {
    thumb.dataset.live = d.live;
    thumb.innerHTML =
      '<div class="thumb-skel">Loading</div>' +
      '<div class="open-ov"><span class="open-pill"><i data-icon="external-link"></i>Open</span></div>';
    io.observe(thumb);
  } else {
    thumb.innerHTML =
      '<div class="thumb-none"><i data-icon="eye-off"></i><span>No live preview</span></div>' +
      '<div class="open-ov"><span class="open-pill"><i data-icon="external-link"></i>View code</span></div>';
  }

  // One page opens straight away; several pages ask which one first. The href stays
  // real either way, so cmd-click always goes direct.
  const paginas = d.variants && d.variants.length ? d.variants.length : 1;
  if (paginas > 1) {
    thumb.onclick = e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openModal(d);
    };
  }

  const body = document.createElement("div");
  body.className = "card-body";

  const hd = document.createElement("div");
  hd.className = "card-hd";
  const t = document.createElement("span");
  t.className = "card-t";
  t.textContent = nameOf(d);
  const pen = document.createElement("button");
  pen.className = "card-edit";
  pen.title = "Rename";
  pen.setAttribute("aria-label", "Rename");
  pen.innerHTML = '<i data-icon="edit"></i>';
  pen.onclick = () => startRename(el, t, d);
  hd.append(t, pen);
  if (renames[d.id]) el.classList.add("is-renamed");

  const track = document.createElement("span");
  track.className = "chip chip-sm " + TRACK_CLASS[d.group];
  track.textContent = d.group;

  const desc = document.createElement("div");
  desc.className = "card-d";
  desc.textContent = d.desc;

  const meta = document.createElement("div");
  meta.className = "card-meta";
  // The avatar already says who; the line next to it says when.
  meta.innerHTML = avatar(d.owner) +
    (d.updated
      ? '<span class="card-by" title="' + d.updated.slice(0, 10) + '">' + sinds(d.updated) + "</span>"
      : "");

  body.append(hd, track, desc, meta);
  el.append(thumb, body);
  return el;
}

function render() {
  if (SHOW_FILTERS) renderFilters();
  document.getElementById("filters").hidden = !SHOW_FILTERS;
  const shown = DATA.filter(matches);
  const host = document.getElementById("sections");
  host.innerHTML = "";
  if (!shown.length) {
    host.innerHTML = '<div class="empty">Nothing found. Adjust your search or filter.</div>';
    return;
  }

  // On All the tracks are just a sort order, not a heading; picking a track already
  // names what you are looking at, so no section header there either.
  const grid = document.createElement("div");
  grid.className = "grid";
  shown.forEach(d => grid.appendChild(card(d)));
  host.append(grid);

  scale();
  if (window.Icons) window.Icons.render();
}

function renderHero() {
  document.getElementById("dsbtn").href = DS.docs;
}

/* ── Renaming a card ── */
function startRename(cardEl, titleEl, d) {
  if (titleEl.querySelector("input")) return;
  const before = nameOf(d);
  const inp = document.createElement("input");
  inp.value = before;
  inp.setAttribute("aria-label", "New name");
  titleEl.textContent = "";
  titleEl.append(inp);
  inp.focus();
  inp.select();

  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const next = inp.value.trim();
    if (commit) {
      if (next && next !== d.name) renames[d.id] = next;
      else delete renames[d.id];
      saveRenames();
    }
    titleEl.textContent = nameOf(d);
    cardEl.classList.toggle("is-renamed", !!renames[d.id]);
  };

  inp.onblur = () => finish(true);
  inp.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  };
}

/* ── Publishing renames back to prototypes.json ── */
function renamedConfig() {
  const cfg = JSON.parse(JSON.stringify(CONFIG));
  cfg.entries.forEach(e => {
    const id = e.repo + "::" + e.path;
    if (renames[id]) e.name = renames[id];
  });
  return JSON.stringify(cfg, null, 2) + "\n";
}

function renderPub() {
  const bar = document.getElementById("pub");
  const txt = document.getElementById("pub-txt");
  const go = document.getElementById("pub-go");
  const undo = document.getElementById("pub-undo");
  const n = Object.keys(renames).length;

  if (SYNC) {
    // Names save themselves; the bar only reports what happened.
    go.hidden = true;
    undo.hidden = syncState !== "failed";
    undo.textContent = "Try again";
    undo.onclick = () => push();
    txt.textContent =
      syncState === "saving" ? "Saving" :
      syncState === "saved" ? "Saved for everyone" :
      syncState === "failed" ? "Not saved" : "";
    bar.classList.toggle("is-on", syncState === "saving" || syncState === "saved" || syncState === "failed");
    return;
  }

  go.hidden = false;
  undo.hidden = false;
  undo.textContent = "Undo";
  undo.onclick = () => { renames = {}; saveRenames(); render(); };
  txt.textContent = n === 1 ? "1 name changed" : n + " names changed";
  bar.classList.toggle("is-on", n > 0);
}

async function publish() {
  const json = renamedConfig();
  let copied = false;
  try { await navigator.clipboard.writeText(json); copied = true; } catch (e) {}

  const n = Object.keys(renames).length;
  document.getElementById("ov-title").textContent = "Publish for everyone";
  document.getElementById("ov-sub").textContent =
    (n === 1 ? "1 changed name" : n + " changed names") + " · prototypes.json";
  document.getElementById("ov-ft").textContent =
    "Your changes stay in this browser until you publish them.";

  const list = document.getElementById("ov-list");
  list.className = "dialog-body steps-wrap";
  list.innerHTML =
    '<div class="steps"><ol>' +
      "<li>" + (copied
        ? '<span class="done">The new prototypes.json is on your clipboard.</span>'
        : 'Copy the new <code>prototypes.json</code> with the button below.') + "</li>" +
      "<li>Click <strong>Open the GitHub editor</strong>. It opens in a new tab.</li>" +
      "<li>Select everything in the file (<code>Cmd + A</code>) and paste (<code>Cmd + V</code>).</li>" +
      "<li>Click <strong>Commit changes</strong>. Everyone sees the new names within a minute.</li>" +
    "</ol></div>";

  const bar = document.createElement("div");
  bar.className = "steps";
  bar.style.display = "flex";
  bar.style.gap = "8px";
  bar.style.paddingTop = "0";

  const copy = document.createElement("button");
  copy.className = "pages-btn";
  copy.textContent = copied ? "Copy again" : "Copy JSON";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(json); copy.textContent = "Copied"; }
    catch (e) { copy.textContent = "Copy failed"; }
  };

  const open = document.createElement("a");
  open.className = "pages-btn";
  open.href = "https://github.com/" + GALLERY_REPO + "/edit/main/prototypes.json";
  open.target = "_blank";
  open.rel = "noopener";
  open.textContent = "Open the GitHub editor";

  bar.append(copy, open);
  list.append(bar);

  lastFocus = document.activeElement;
  ov.classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.getElementById("ov-close").focus();
}

/* ── Modal listing every page of one prototype ── */
const ov = document.getElementById("ov");
let lastFocus = null;

function openModal(d) {
  lastFocus = document.activeElement;
  const pages = d.variants && d.variants.length
    ? d.variants
    : [{ label: d.name, live: d.live, code: d.code }];

  document.getElementById("ov-title").textContent = nameOf(d);
  document.getElementById("ov-sub").textContent =
    "in repository " + d.repos.map(r => r.org + "/" + r.name).join(", ");

  document.getElementById("ov-ft").textContent = "Every page opens in a new tab.";

  const list = document.getElementById("ov-list");
  list.className = "dialog-body list-frame";
  list.innerHTML = "";
  pages.forEach((v, i) => {
    const a = document.createElement("a");
    a.className = "list-item is-interactive";
    a.href = v.live || v.code;
    a.target = "_blank";
    a.rel = "noopener";

    const num = document.createElement("span");
    num.className = "list-item-num";
    num.textContent = i + 1;

    const content = document.createElement("div");
    content.className = "list-item-content";
    const title = document.createElement("div");
    title.className = "list-item-title";
    title.textContent = v.label;
    const sub = document.createElement("div");
    sub.className = "list-item-sub";
    const file = document.createElement("span");
    file.textContent = (v.code || v.live || "").split("/").pop() || v.label;
    sub.append(file);
    content.append(title, sub);

    const trailing = document.createElement("div");
    trailing.className = "list-item-trailing";
    trailing.innerHTML = '<i data-icon="' + (v.live ? "external-link" : "code") + '"></i>';

    a.append(num, content, trailing);
    list.append(a);
  });


  ov.classList.add("is-open");
  document.body.style.overflow = "hidden";
  if (window.Icons) window.Icons.render(ov);   // rows were just built
  document.getElementById("ov-close").focus();
}

function closeModal() {
  ov.classList.remove("is-open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

document.getElementById("ov-close").onclick = closeModal;
ov.addEventListener("click", e => { if (e.target === ov) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ov.classList.contains("is-open")) closeModal();
});

/* Each thumbnail renders a 1440px-wide viewport, scaled down to the card width. */
function scale() {
  const t = document.querySelector(".thumb");
  if (!t) return;
  document.documentElement.style.setProperty("--s", (t.clientWidth / 1440).toFixed(4));
}

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});
window.addEventListener("resize", scale);

document.getElementById("pub-go").onclick = publish;

renderHero();
render();
renderPub();
pullFile();
pull();
</script>
